<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install app</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0b0d12; color: #e7e9ee; padding: 24px;
      }
      .card {
        max-width: 420px; width: 100%; background: #161a23; border: 1px solid #232838;
        border-radius: 16px; padding: 28px; text-align: center;
      }
      h1 { font-size: 1.3rem; margin: 0 0 6px; }
      p { color: #9aa3b2; line-height: 1.5; margin: 8px 0; }
      a.btn {
        display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 12px;
        background: #5865f2; color: #fff; text-decoration: none; font-weight: 600; font-size: 1.05rem;
      }
      a.btn:active { opacity: 0.85; }
      .note { font-size: 0.8rem; color: #6b7280; margin-top: 18px; }
      code { background: #0b0d12; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Install</h1>
      <p id="sub">Tap the button below on your iPhone or iPad to install.</p>
      <a class="btn" id="install" href="#">📲 Install now</a>
      <p class="note" id="note">
        This only installs on devices registered to the signing account. Open this page in
        <strong>Safari</strong> on the device.
      </p>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const manifest = params.get('m');
      const name = params.get('name') || 'this app';
      document.getElementById('title').textContent = 'Install ' + name;
      const link = document.getElementById('install');
      if (manifest) {
        link.href = 'itms-services://?action=download-manifest&url=' + encodeURIComponent(manifest);
      } else {
        document.getElementById('sub').textContent = 'Missing manifest URL.';
        link.style.display = 'none';
      }
      // Non-Apple devices can't use itms-services.
      const isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
      if (!isApple) {
        document.getElementById('note').innerHTML =
          'Open this link on an <strong>iPhone or iPad in Safari</strong> — <code>itms-services</code> installs only work on Apple devices.';
      }
    </script>
  </body>
</html>
